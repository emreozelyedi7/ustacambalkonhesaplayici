<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profesyonel Teklif Robotu</title>
  
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#ffffff">

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">

  <style>
    body { 
        font-family: 'Segoe UI', sans-serif; 
        background-color: #f0f2f5; 
        margin: 0; padding: 0;
        display: flex; justify-content: center;
        min-height: 100vh;
    }
    
    .main-wrapper {
        width: 100%; max-width: 450px;
        background: white; padding: 20px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        min-height: 100vh;
    }

    .logo-container { text-align: center; margin-bottom: 10px; }
    .logo-container img { max-width: 200px; height: auto; }

    label { display: block; margin-top: 10px; font-weight: bold; font-size: 13px; color: #555; }
    input, select { width: 100%; padding: 12px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; transition: border 0.3s;}
    input:focus, select:focus { border-color: #007bff; outline: none; }
    
    .note { font-size: 11px; color: #888; margin-top: 3px; }

    .rate-box { background-color: #e3f2fd; padding: 15px; border-radius: 8px; border: 1px solid #bbdefb; margin-bottom: 20px; }
    .rate-box label { color: #0d47a1; margin-top: 0; }
    .rate-box input { border-color: #90caf9; font-weight: bold; color: #0d47a1; font-size: 18px; }

    button { width: 100%; background-color: #28a745; color: white; padding: 15px; border: none; margin-top: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s;}
    button:hover { opacity: 0.9; }
    button.secondary { background-color: #007bff; margin-top: 10px; }
    button.danger { background-color: #dc3545; margin-top: 5px; }
    
    #downloadBtn { background-color: #ff9800; display: none; margin-top: 15px; }
    #shareBtn { background-color: #007bff; display: none; margin-top: 10px; }
    
    #shareVideoBtn { 
        background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        color: white;
        display: none; 
        margin-top: 10px; 
    }

    .result { margin-top: 20px; padding: 20px; background-color: #343a40; border-radius: 8px; text-align: center; color: #fff; }
    .result-big { font-size: 28px; font-weight: bold; color: #28a745; display: block; margin-top: 5px;}
    
    .hidden { display: none; }
    .nav { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px;}
    .nav a { text-decoration: none; color: #666; font-size: 14px; cursor: pointer; padding: 10px; }
    .nav a.active { color: #007bff; font-weight: bold; border-bottom: 3px solid #007bff; margin-bottom: -12px; }

    /* Sistem Blokları Stili (Karma Teklif İçin) */
    .system-block {
        background-color: #fcfcfc;
        border: 1px solid #e0e0e0;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 15px;
        position: relative;
    }
    .system-title {
        margin: 0 0 10px 0; color: #007bff; font-size: 15px;
        border-bottom: 2px solid #e3f2fd; padding-bottom: 5px;
    }
    .remove-system-btn {
        position: absolute; top: 10px; right: 10px;
        background-color: #dc3545; color: white; border: none;
        border-radius: 4px; padding: 5px 10px; font-size: 12px; cursor: pointer; width: auto; margin:0;
    }

    .width-container { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px;}
    .width-input { flex: 1 1 30%; text-align: center; min-width: 80px; }
    
    .action-buttons { display: flex; gap: 5px; margin-top: 5px; }
    .addWidthBtn { background-color: #17a2b8; padding: 10px; font-size: 13px; margin-top: 0; flex: 2; width: auto;}
    .resetWidthBtn { background-color: #6c757d; padding: 10px; font-size: 13px; margin-top: 0; flex: 1; width: auto;}

    #addSystemBtn {
        background-color: #6c757d; border: 2px dashed #adb5bd; color: white;
        margin-bottom: 20px;
    }

    .report-section { background-color: #fff3cd; border: 1px solid #ffeeba; padding: 15px; margin-top: 20px; border-radius: 8px; }
    .report-btn { background-color: #17a2b8; color: white; }

    .extra-box {
        background-color: #f8f9fa; border: 1px dashed #ced4da;
        padding: 10px; border-radius: 6px; margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="logo-container">
      <img src="image_0.png" id="mainLogo" alt="Logo">
  </div>

  <div class="nav">
    <a id="nav-calc" class="active">HESAP MAKİNESİ</a>
    <a id="nav-settings">AYARLAR / RAPOR</a>
  </div>

  <div id="calc-section" class="container">
    <div class="rate-box">
      <label>Dolar Kuru (TL):</label>
      <input type="number" id="currentRate" placeholder="Örn: 35.00" step="0.01">
    </div>

    <label>Müşteri Adı:</label>
    <input type="text" id="customerName" placeholder="Örn: Ahmet Bey">

    <label>Görüşülen Kanal:</label>
    <select id="salesChannel">
        <option value="WhatsApp">WhatsApp</option>
        <option value="Instagram">Instagram</option>
        <option value="Tavsiye">Tavsiye / Referans</option>
        <option value="Google">Google / Web</option>
        <option value="Diğer">Diğer</option>
    </select>

    <label>Ödeme Tipi:</label>
    <select id="globalPaymentType" style="border: 2px solid #007bff; font-weight: bold; color: #007bff;">
        <option value="card">💳 Kredi Kartı Fiyatı (5 Taksit)</option>
        <option value="cash">💵 Nakit Fiyatı (İndirimli)</option>
    </select>

    <hr style="margin: 20px 0; border: 0; border-top: 2px solid #eee;">

    <!-- SİSTEMLER KUTUSU (DİNAMİK) -->
    <div id="systems-container">
        <!-- Varsayılan 1. Sistem Bloğu -->
        <div class="system-block" data-index="1">
            <h4 class="system-title">1. SİSTEM</h4>
            
            <label>Ürün Seçin:</label>
            <select class="productSelect">
              <option value="">Seçiniz...</option>
            </select>

            <label>Balkon En Ölçüleri (cm):</label>
            <div class="width-container">
                <input type="number" class="width-input" placeholder="En 1">
            </div>
            <div class="action-buttons">
                <button type="button" class="addWidthBtn">+ En Ekle</button>
                <button type="button" class="resetWidthBtn">🔄 Temizle</button>
            </div>

            <label>Yükseklik (cm):</label>
            <input type="number" class="heightInput" placeholder="Örn: 200">
        </div>
    </div>

    <!-- YENİ SİSTEM EKLEME BUTONU -->
    <button id="addSystemBtn" type="button">➕ Farklı Bir Sistem Daha Ekle (Karma Teklif)</button>

    <div class="extra-box">
        <label style="margin-top:0;">Genel Ek Malzeme / İşçilik (Opsiyonel):</label>
        <input type="text" id="extraItemName" placeholder="Örn: Kutu Profil / Vinç">
        <input type="number" id="extraItemPrice" placeholder="Ek Tutar (TL)" style="margin-top:5px;">
    </div>

    <button id="calculateBtn">HESAPLA</button>

    <div class="result" id="resultArea">
      <span>Genel Toplam:</span>
      <span class="result-big">0.00 ₺</span>
      <span style="font-size: 12px; opacity: 0.7; display:block; margin-top:5px;" id="detailInfo"></span>
    </div>

    <button id="downloadBtn">📸 A4 Teklifi İndir</button>
    <button id="shareBtn">📤 Teklifi Paylaş</button>
    <button id="shareVideoBtn">🎥 Tanıtım Videosu Linkini Gönder</button>
  </div>

  <div id="settings-section" class="container hidden">
    <label>Ürün Adı (Uzun):</label>
    <input type="text" id="newProductName" placeholder="Örn: Yeni Ürün">
    <label>Resim Dosya Adı (Kısa):</label>
    <input type="text" id="newProductImage" placeholder="Örn: 6">
    <label>Video Linki (Instagram):</label>
    <input type="text" id="newProductVideo" placeholder="https://instagram.com/reel/...">
    <label>m² Birim Fiyatı ($):</label>
    <input type="number" id="newProductPrice" placeholder="Örn: 100">

    <button class="secondary" id="saveProductBtn">KAYDET</button>
    <button onclick="resetDefaultProducts()" style="background-color:#6c757d; margin-top:10px;">🔄 Varsayılan Ürünleri Yükle</button>
    
    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
    <label>Kayıtlı Ürünler:</label>
    <select id="deleteSelect"></select>
    <button class="danger" id="deleteProductBtn">SİL</button>

    <div class="report-section">
        <h3 style="margin-top:0; color:#856404; text-align:center;">📊 Günlük Tablo</h3>
        <p style="font-size:12px; color:#856404; text-align:center;">Hesapla butonuna bastığınız her işlem kaydedilir.</p>
        <button id="downloadReportBtn" class="report-btn">📥 Tabloyu İndir (Excel)</button>
        <button id="clearReportBtn" class="danger">🗑️ Tabloyu Temizle</button>
    </div>
  </div>
</div>

<script src="script.js?v=36"></script>
</body>
</html>
